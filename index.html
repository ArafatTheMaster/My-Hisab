let TM=(()=>{try{const o=JSON.parse(localStorage.getItem('hs_tm')||'null');if(o&&o.sw&&o.cd)return o}catch(x){}return {m:'sw',sw:{run:false,st:0,acc:0,laps:[]},cd:{total:300000,run:false,end:0,left:300000}}})();

 try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.4,.8,1.2].forEach(o=>{const s=c.createOscillator(),g=c.createGain();s.connect(g);g.connect(c.destination);s.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+o+.3);s.start(c.currentTime+o);s.stop(c.currentTime+o+.32)})}catch(x){}
 try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(x){}

 set(ref(db,'allowed/'+ekey(m)),{email:m,added:Date.now()}).then(()=>{$('#ue').value=''}).catch(x=>alert('ত্রুটি: '+x.code))};
window.removeAllowed=m=>{if(confirm(m+' কে সরাবেন? সে আর সাইন ইন করতে পারবে না (তার ডাটা মুছবে না)।'))remove(ref(db,'allowed/'+ekey(m))).catch(x=>alert('ত্রুটি: '+x.code))};
window.viewUser=(uid,m)=>{get(ref(db,'users/'+uid+'/data')).then(sn=>{if(!sn.exists())alert('এই ইউজারের এখনো কোনো ডাটা নেই');else enterView(sn.val(),m)}).catch(x=>alert('ত্রুটি: '+x.code))};
let r=null,unsub=null,uA=null,uP=null;
window.cloudPush=()=>{if(!r||VIEW)return;st('Syncing…');set(r,getS()).then(()=>st('● Live')).catch(x=>st('Sync error: '+x.code))};
onAuthStateChanged(auth,async u=>{
  if(unsub){unsub();unsub=null}if(uA){uA();uA=null}if(uP){uP();uP=null}
  r=null;
  if(!u){window.ISADMIN=false;window.AL={};window.PR={};loadLocal('');setProfile(null);R();$('#ll').style.display='none';$('#lg').style.display='block';$('#lk').style.display='flex';st('Signed out');return}
  const email=(u.email||'').toLowerCase(),adm=email===ADMIN.toLowerCase();
  if(!adm){
    let ok=false,K='hs_ok_'+email;
    try{ok=(await get(ref(db,'allowed/'+ekey(email)))).exists();try{ok?localStorage.setItem(K,'1'):localStorage.removeItem(K)}catch(z){}}
    catch(x){if(x&&x.code=='PERMISSION_DENIED'){try{localStorage.removeItem(K)}catch(z){}}else{try{ok=localStorage.getItem(K)=='1'}catch(z){}}}
    if(!ok){msg('এই ইমেইল ('+email+') অনুমোদিত নয়। অ্যাডমিনকে বলুন আপনার ইমেইল যোগ করতে।');signOut(auth);return}
  }
  window.ISADMIN=adm;$('#lk').style.display='none';msg('');setProfile({name:u.displayName||'',email,photo:u.photoURL||'',admin:adm});try{localStorage.setItem('hs_last',JSON.stringify({uid:u.uid,name:u.displayName||'',email,photo:u.photoURL||'',admin:adm}))}catch(z){}
  loadLocal(u.uid);R();
  set(ref(db,'profiles/'+u.uid),{email,name:u.displayName||'',seen:Date.now()}).catch(()=>{});
  if(adm){
    uA=onValue(ref(db,'allowed'),sn=>{window.AL=sn.val()||{};if(T=='u'&&!VIEW)R()});
    uP=onValue(ref(db,'profiles'),sn=>{window.PR=sn.val()||{};if(T=='u'&&!VIEW)R()});
  }
  r=ref(db,'users/'+u.uid+'/data');st('Connecting…');
  unsub=onValue(r,snap=>{
    if(VIEW)return;
    const o=snap.val(),l=getS();
    if(!o){set(r,l).then(()=>st('● Live')).catch(x=>st('Sync error: '+x.code));return}
    if((o.u||0)>(l.u||0)){setS({shop:arr(o.shop),tx:arr(o.tx),inc:arr(o.inc),sav:arr(o.sav),todo:arr(o.todo),inv:arr(o.inv).map(fixInv),ob:o.ob||{},cadd:o.cadd||{},u:o.u});loc();R()}
    else if((l.u||0)>(o.u||0)){set(r,l)}
    st('● Live');
  },x=>st('Sync error: '+x.code));
});
</script>
</body>
