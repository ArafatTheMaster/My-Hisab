<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a14">
<title>My Hisab – Budget &amp; Shopping Planner</title>
<style>
:root{color-scheme:dark;--g:rgba(255,255,255,.06);--gb:rgba(255,255,255,.12);--t:#f5f3ee;--m:#a1a1b5;--ok:#4ade80;--bad:#fb7185;--wa:#fbbf24;--ac:#d4af37;--in:rgba(255,255,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--t);font-family:"Inter","Segoe UI","Noto Sans Bengali",system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 10% -10%,rgba(212,175,55,.16),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(124,58,237,.2),transparent 60%),linear-gradient(180deg,#07070d,#0e0b1f 60%,#07070d) fixed;padding-bottom:84px}
.w{max-width:980px;margin:0 auto;padding:14px}
.gl{background:var(--g);border:1px solid var(--gb);border-radius:22px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);padding:16px;margin-bottom:14px}
h1{font-size:1.25rem;margin:0;letter-spacing:.3px}h1 em{font-style:normal;color:var(--ac)}h2{font-size:1.02rem;margin:0 0 10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--t)}
input,select{background:var(--in);border:1px solid var(--gb);border-radius:12px;padding:10px 12px;min-width:0;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac)}
select option{background:#14122a;color:#f5f3ee}
input[type=range]{padding:0;accent-color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.bt{background:linear-gradient(135deg,#f5d77a,#d4af37 55%,#a67c1a);color:#1a1405;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700}
.sm{background:var(--in);border:1px solid var(--gb);border-radius:10px;padding:6px 10px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.cards .gl{margin:0}.cards small{color:var(--m)}.cards b{display:block;font-size:1.35rem;margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--m);font-size:.9rem}
.br{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.tr{height:10px;background:var(--in);border-radius:9px;overflow:hidden}.tr i{display:block;height:100%;border-radius:9px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--gb)}
.it .x{flex:1;min-width:0}.it .x b{overflow-wrap:anywhere}.it.dn .x b{text-decoration:line-through;opacity:.5}
.it input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.tag{font-size:.75rem;border-radius:9px;padding:2px 8px;color:#111;font-weight:600;white-space:nowrap}
.ml{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--gb)}
.ml:first-of-type{border-top:0}
.ml.tt{border-top:2px solid var(--ac);margin-top:4px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.three>div{background:var(--in);border-radius:14px;padding:12px}.three small{color:var(--m)}.three b{display:block;font-size:1.15rem;margin-top:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.two>div{background:var(--in);border-radius:14px;padding:12px}.two small{color:var(--m)}.two b{display:block;font-size:1.2rem;margin-top:4px}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hr input{width:auto}#st{font-size:.8rem}#st.live{display:inline-flex;align-items:center;gap:10px;color:var(--ok)}#st.live::before{content:'';width:10px;height:10px;border-radius:50%;background:#2dd4bf;outline:2px solid rgba(45,212,191,.35);outline-offset:3px;animation:pl 1.6s ease-out infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(45,212,191,.75),0 0 8px #2dd4bf}100%{box-shadow:0 0 0 14px rgba(45,212,191,0),0 0 8px #2dd4bf}}
footer{text-align:center;color:var(--m);font-size:.82rem;padding:10px 0 20px}footer b{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,20,.72);border-top:1px solid var(--gb);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:10}
nav button{flex:1;max-width:200px;background:none;border:0;border-radius:14px;padding:8px 4px;cursor:pointer;font-size:.78rem;color:var(--m)}
nav button span{display:block;font-size:1.25rem}nav button.on{background:var(--in);font-weight:700;color:var(--ac)}
@media(min-width:760px){body{padding-bottom:0;padding-top:64px}nav{top:0;bottom:auto;padding:8px;border-top:0;border-bottom:1px solid var(--gb)}nav button span{display:inline;margin-right:6px}nav button{font-size:.95rem}}
</style>
</head>
<body>
<nav id="nv"></nav>
<div class="w">
<div class="gl hd"><h1>💰 My <em>Hisab</em></h1><div class="hr"><span id="st" class="mu">Local mode</span><button class="sm" onclick="doLogout()" title="সাইন আউট">🔑</button><input type="month" id="mp" onchange="M=this.value;R()"></div></div>
<div id="v"></div>
<div id="lk" style="display:none;position:fixed;inset:0;z-index:50;background:#07070d;overflow:auto;align-items:center;justify-content:center;padding:20px"><div class="gl" style="max-width:380px;width:100%;text-align:center;margin:auto"><h1>💰 My <em>Hisab</em></h1><p class="mu">Google অ্যাকাউন্ট দিয়ে সাইন ইন করুন। যেকোনো ডিভাইসে একই Google অ্যাকাউন্টে সাইন ইন করলে নিজের ডাটা দেখা যাবে, অন্যরা নিজের অ্যাকাউন্টে আলাদা ডাটা পাবে।</p>
<p id="lm" class="bad" style="min-height:1.2em;margin:6px 0"></p>
<button class="bt" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px" onclick="doGoogle()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Google দিয়ে সাইন ইন / সাইন আপ</button></div></div>
<footer>© <span id="yr"></span> <b>Arafat Ahmed</b>. All rights reserved.</footer>
</div>
<script>
const $=s=>document.querySelector(s);
let S={shop:[],tx:[],inc:[],sav:[],u:0},T='d',tz=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString();
let M=tz.slice(0,7);
$('#yr').textContent=new Date().getFullYear();
let UID='';
function loadLocal(uid){UID=uid;S={shop:[],tx:[],inc:[],sav:[],u:0};
 try{const k='bz1_'+uid;
  if(uid&&localStorage.getItem('bz1')&&!localStorage.getItem(k)){localStorage.setItem(k,localStorage.getItem('bz1'));localStorage.removeItem('bz1')}
  if(uid)S=Object.assign(S,JSON.parse(localStorage.getItem(k)||'{}'));}catch(x){}}
const loc=()=>{if(!UID)return;try{localStorage.setItem('bz1_'+UID,JSON.stringify(S))}catch(x){}};
const sv=()=>{S.u=Date.now();loc();if(window.cloudPush)window.cloudPush()};
const getS=()=>S,setS=x=>{S=x};
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>'৳'+Math.round(n).toLocaleString('en-IN');
const sum=a=>a.reduce((x,y)=>x+y.amt,0);
const inM=(a,m)=>a.filter(x=>x.d.slice(0,7)==m);
const inY=(a,y)=>a.filter(x=>x.d.slice(0,4)==y);
const allInc=()=>[...S.tx.filter(x=>x.k=='i'),...S.inc];
const allExp=()=>S.tx.filter(x=>x.k=='e');
const incAll=m=>inM(allInc(),m);
const expM=m=>inM(allExp(),m);
const by=a=>{const o={};a.forEach(x=>o[x.c]=(o[x.c]||0)+x.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const bars=(r,c)=>{const mx=Math.max(1,...r.map(x=>x[1]));return r.length?r.map(x=>`<div class="br"><span>${e(x[0])}</span><div class="tr"><i style="width:${x[1]/mx*100}%;background:${c}"></i></div><b>${f(x[1])}</b></div>`).join(''):'<p class="mu">কোনো তথ্য নেই</p>'};
const pr=p=>p>=75?['Critical','var(--bad)']:p>=40?['Important','var(--wa)']:['Can wait','var(--ok)'];
const BM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bmn=m=>BM[+m.slice(5,7)-1]+' '+m.slice(0,4);
const EC=['Groceries','Rent','Bills','Transport','Health','Education','Entertainment','Other'];
const IC=['Monthly Salary','Extra Income','Business','Gift / Deposit','Other'];
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const TABS=[['d','📊','Dashboard'],['s','🛒','Shopping'],['t','🧾','Transactions'],['i','💵','Income'],['v','🏦','Savings']];
const SC=['DPS','Bank Savings','FDR','Cash Savings','Gold','Investment','Other'];

function R(){
 $('#mp').value=M;
 $('#nv').innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" onclick="T='${t[0]}';EI=ES=ET=EV=null;R()"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('#v').innerHTML={d:vD,s:vS,t:vT,i:vI,v:vV}[T]();
 if(T=='t')ck(ET?(S.tx.find(a=>a.id==ET)||{}).c:null);
}
function pm(m){const d=new Date(+m.slice(0,4),+m.slice(5,7)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function grp(t,m,cls){const i=sum(incAll(m)),x=sum(expM(m)),b=i-x,cf=sum(allInc().filter(z=>z.d.slice(0,7)<m))-sum(allExp().filter(z=>z.d.slice(0,7)<m));
 return `<div class="gl"><h2>${t} <span class="mu">· ${bmn(m)}</span></h2><div class="three">
 <div><small>মাসিক আয়</small><b class="ok">${f(i)}</b></div>
 <div><small>মাসিক খরচ</small><b class="bad">${f(x)}</b></div>
 <div><small>মাসিক অবশিষ্ট ব্যালেন্স</small><b class="${b<0?'bad':''}">${f(b)}</b></div>
 <div><small>আগের মাসের জমা</small><b class="${cf<0?'bad':''}">${f(cf)}</b></div></div></div>`}
function vD(){
 const y=M.slice(0,4),cur=tz.slice(0,7);
 const tI=sum(allInc()),tE=sum(allExp()),tB=tI-tE;
 const yi=inY(allInc(),y),yI=sum(yi),yE=sum(inY(allExp(),y));
 return grp('This Month',cur)+grp('Last Month',pm(cur))+grp('Historical Month',pm(pm(cur)))+
 `<div class="gl"><h2>সর্বমোট</h2><div class="three">
 <div><small>মোট আয়</small><b class="ok">${f(tI)}</b></div>
 <div><small>মোট খরচ</small><b class="bad">${f(tE)}</b></div>
 <div><small>মোট অবশিষ্ট ব্যালেন্স</small><b class="${tB<0?'bad':''}">${f(tB)}</b></div></div></div>
 <div class="gl"><h2>📅 ${y} সালের ১২ মাসের মোট</h2>
 <div class="two"><div><small>১২ মাসে মোট আর্নিং</small><b class="ok">${f(yI)}</b></div><div><small>১২ মাসে মোট ব্যয়</small><b class="bad">${f(yE)}</b></div></div></div>
 <div class="gl"><h2>💼 ${y} সালে কোন খাত থেকে কত এসেছে</h2>${bars(by(yi).map(r=>[r[0]=='Monthly Salary'?'বেতন':r[0],r[1]]),'var(--ok)')}</div>`;
}
let ES=null,ET=null,EV=null;
function vS(){
 const L=[...S.shop].sort((a,b)=>a.dn-b.dn||b.p-a.p);
 const ed=ES?S.shop.find(a=>a.id==ES):null,dv=ed||{n:'',q:'',pr:'',p:50};
 return `<div class="gl"><h2>${ed?'✏️ আইটেম এডিট করুন':'🛒 Shopping List'}</h2>
 <div class="row"><input id="sn" placeholder="Item name" value="${e(dv.n)}"><input id="sq" placeholder="Quantity (2 kg)" value="${e(dv.q)}"><input id="sp" type="text" inputmode="decimal" oninput="fm(this)" placeholder="Estimated price" value="${cm(dv.pr)}"></div>
 <div class="row" style="align-items:center"><label class="mu">Priority: <b id="pv">${dv.p}%</b><input id="sr" type="range" min="0" max="100" step="5" value="${dv.p}" oninput="pv.textContent=this.value+'%'"></label><button class="bt" onclick="aS()">${ed?'Update':'Add item'}</button>${ed?'<button class="sm" onclick="ES=null;R()">Cancel</button>':''}</div></div>
 <div class="gl">${L.length?L.map(x=>{const g=pr(x.p);return `<div class="it ${x.dn?'dn':''}"><input type="checkbox" ${x.dn?'checked':''} onchange="tg(${x.id})"><div class="x"><b>${e(x.n)}</b> <span class="mu">${e(x.q)} ${x.pr?'· '+f(x.pr):''}</span><div class="tr" style="margin-top:6px"><i style="width:${x.p}%;background:${g[1]}"></i></div></div><span class="tag" style="background:${g[1]}">${x.p}% · ${g[0]}</span><button class="sm" onclick="ES=${x.id};R();scrollTo(0,0)">✎</button><button class="sm" onclick="dS(${x.id})">✕</button></div>`}).join(''):'<p class="mu">Your list is empty. Add an item above.</p>'}
 ${S.shop.some(x=>x.dn)?'<button class="bt" style="margin-top:10px" onclick="by2()">✅ Add purchased items to expenses</button>':''}</div>`;
}
function vT(){
 const L=inM(S.tx,M).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 const ed=ET?S.tx.find(a=>a.id==ET):null,dv=ed||{k:'e',amt:'',nt:'',d:tz.slice(0,10)};
 return `<div class="gl"><h2>${ed?'✏️ এন্ট্রি এডিট করুন':'🧾 Add Income / Expense'}</h2>
 <div class="row"><select id="tk" onchange="ck()"><option value="e"${dv.k=='e'?' selected':''}>Expense</option><option value="i"${dv.k=='i'?' selected':''}>Income</option></select><select id="tc"></select><input id="ta" type="text" inputmode="decimal" oninput="fm(this)" placeholder="Amount" value="${cm(dv.amt)}"></div>
 <div class="row"><input id="tn" placeholder="Note (optional)" value="${e(dv.nt||'')}"><input id="td" type="date" value="${dv.d}"><button class="bt" onclick="aT()">${ed?'Update':'Add'}</button>${ed?'<button class="sm" onclick="ET=null;R()">Cancel</button>':''}</div></div>
 <div class="gl">${L.length?L.map(x=>`<div class="it"><div class="x"><b>${e(x.c)}</b> <span class="mu">${e(x.nt||'')} · ${x.d.slice(8)}/${x.d.slice(5,7)}</span></div><b class="${x.k=='i'?'ok':'bad'}">${x.k=='i'?'+':'−'}${f(x.amt)}</b><button class="sm" onclick="ET=${x.id};R();scrollTo(0,0)">✎</button><button class="sm" onclick="dT(${x.id})">✕</button></div>`).join(''):'<p class="mu">No transactions this month.</p>'}</div>`;
}
let EI=null;
function vI(){
 const L=inM(S.inc,M).sort((a,b)=>b.d.localeCompare(a.d));
 const y=M.slice(0,4),months=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));
 const ed=EI?S.inc.find(a=>a.id==EI):null,dv=ed||{c:'',amt:'',d:tz.slice(0,10),nt:''};
 return `<div class="gl"><h2>${ed?'✏️ এন্ট্রি এডিট করুন':'💵 Income Sources &amp; Deposits'}</h2><p class="mu" style="margin-top:0">Record salary, extra income or deposits separately. They are added to income on the dashboard.</p>
 <div class="row"><select id="ic">${IC.map(x=>`<option${x==dv.c?' selected':''}>${x}</option>`).join('')}</select><input id="ia" type="text" inputmode="decimal" oninput="fm(this)" placeholder="Amount" value="${cm(dv.amt)}"><input id="id" type="date" value="${dv.d}"></div>
 <div class="row"><input id="in" placeholder="Note (optional)" value="${e(dv.nt||'')}"><button class="bt" onclick="aI()">${ed?'Update':'Save deposit'}</button>${ed?'<button class="sm" onclick="EI=null;R()">Cancel</button>':''}</div></div>
 <div class="gl"><h2>📅 ${y} সালের ১২ মাসের আয়</h2>
 ${months.map(m=>`<div class="ml" style="cursor:pointer${m==M?';color:var(--ac)':''}" onclick="M='${m}';R()"><span>${BM[+m.slice(5)-1]}</span><b class="ok">${f(sum(incAll(m)))}</b></div>`).join('')}
 <div class="ml tt"><span>১২ মাসের মোট আয়</span><b class="ok">${f(sum(inY(allInc(),y)))}</b></div></div>
 <div class="gl"><h2>${bmn(M)}: ${f(sum(incAll(M)))}</h2>${bars(by(incAll(M)),'var(--ok)')}</div>
 <div class="gl"><h2>Entries (${bmn(M)})</h2>${L.length?L.map(x=>`<div class="it"><div class="x"><b>${e(x.c)}</b> <span class="mu">${e(x.nt||'')} · ${x.d.slice(8)}/${x.d.slice(5,7)}</span></div><b class="ok">+${f(x.amt)}</b><button class="sm" onclick="EI=${x.id};R();scrollTo(0,0)">✎</button><button class="sm" onclick="dI(${x.id})">✕</button></div>`).join(''):'<p class="mu">No entries this month.</p>'}</div>`;
}
function vV(){
 const y=M.slice(0,4),A=S.sav||[],months=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));
 const L=inM(A,M).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
 const ed=EV?A.find(a=>a.id==EV):null,dv=ed||{c:'',amt:'',d:tz.slice(0,10),nt:''};
 return `<div class="gl"><h2>${ed?'✏️ সেভিংস এডিট করুন':'🏦 সেভিংস যোগ করুন'}</h2>
 <div class="row"><select id="vc">${SC.map(x=>`<option${x==dv.c?' selected':''}>${x}</option>`).join('')}</select><input id="va" type="text" inputmode="decimal" oninput="fm(this)" placeholder="Amount" value="${cm(dv.amt)}"><input id="vd" type="date" value="${dv.d}"></div>
 <div class="row"><input id="vn" placeholder="Note (optional)" value="${e(dv.nt||'')}"><button class="bt" onclick="aV()">${ed?'Update':'Save'}</button>${ed?'<button class="sm" onclick="EV=null;R()">Cancel</button>':''}</div></div>
 <div class="gl"><h2>মোট সেভিংস</h2><div class="three"><div><small>সর্বমোট</small><b class="ok">${f(sum(A))}</b></div><div><small>${y} সালে</small><b class="ok">${f(sum(inY(A,y)))}</b></div><div><small>${bmn(M)}</small><b class="ok">${f(sum(inM(A,M)))}</b></div></div></div>
 <div class="gl"><h2>📅 ${y} সালের ১২ মাসের সেভিংস</h2>
